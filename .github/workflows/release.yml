name: Kairos-Pomodoro Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

# tauri-action creates the GitHub release and uploads assets, which requires
# write access to repo contents. The default GITHUB_TOKEN is read-only in repos
# with restricted default permissions — without this, release creation fails
# with "Resource not accessible by integration". pull-requests: write lets the
# cask job open its bump PR (it cannot push to main directly — the `Main`
# ruleset requires pull requests and only the admin role bypasses it).
permissions:
  contents: write
  pull-requests: write

# Prevent concurrent release builds from racing on the same tag and clobbering
# each other's release assets / latest.json manifest.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      # tauri-action builds, signs with TAURI_SIGNING_PRIVATE_KEY, generates the
      # updater manifest (latest.json with a `platforms` map), and uploads all
      # artifacts to the GitHub release identified by tagName. Replaces the old
      # manual `tauri build` + ad-hoc macOS codesign/repack + broken upload
      # globs that never produced a manifest (root cause of the dead updater).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Kairos-Pomodoro ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generateReleaseNotes: true
          # NSIS is the Windows updater bundle format (the app bundles nsis,
          # not msi). updaterJsonPreferNsis makes the manifest key the nsis URL.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Guard: fail loudly if the updater manifest was not generated, so a
      # silent regression (the exact bug that shipped v1.2.0 with no manifest)
      # can never pass CI again. tauri-action writes latest.json to the runner
      # CWD and uploads it to the release; we assert it exists locally.
      - name: Verify updater manifest exists
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f "latest.json" ]; then
            echo "::error::latest.json updater manifest was not generated — updater will be dead."
            echo "Build artifacts present:"
            find src-tauri/target/release/bundle -maxdepth 3 -type f 2>/dev/null | head -40
            exit 1
          fi
          echo "::notice::Updater manifest present"
          echo "=== latest.json ==="
          cat latest.json

  # This runs in the same workflow as the release because releases created
  # with GITHUB_TOKEN do not trigger a separate `release` workflow. It waits
  # for all platform artifacts, then updates the cask served by this tap.
  update-homebrew-cask:
    name: Update Homebrew cask
    needs: publish-tauri
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Add Homebrew to PATH
        # ubuntu-latest (24.04+) ships Homebrew but no longer puts it on PATH —
        # see actions/runner-images Ubuntu2404-Readme. Only ubuntu-22.04, which
        # the linux build job is pinned to, still has it there.
        #
        # The absolute path is required because `brew --prefix` cannot
        # bootstrap itself, and $GITHUB_PATH takes bare directory entries — not
        # the VAR=value lines that `brew shellenv` prints, which would each
        # become a junk PATH entry (its PATH= line included).
        run: |
          brew_prefix="$(/home/linuxbrew/.linuxbrew/bin/brew --prefix)"
          echo "$brew_prefix/bin" >> "$GITHUB_PATH"

      - name: Update checksum and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version"

          asset="Kairos-Pomodoro_${version}_aarch64.dmg"
          url="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${asset}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$asset" "$url"
          checksum="$(sha256sum "$RUNNER_TEMP/$asset" | awk '{print $1}')"

          node scripts/update-homebrew-cask.js "$version" "$checksum"

      - name: Commit updated cask
        id: commit
        run: |
          if git diff --quiet -- Casks/kairos-pomodoro.rb; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/kairos-pomodoro.rb
          git commit -m "chore(homebrew): update cask for ${{ github.ref_name }}"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Style/audit run AFTER the commit and against a tap, for two reasons:
      # a bare `brew style --cask <path>` is rejected ("casks must be in a
      # tap"), and `brew tap` of the workspace clones committed state — so
      # auditing before the commit would validate the previous release's
      # cask, not the one about to ship.
      - name: Style and audit the updated cask
        if: steps.commit.outputs.committed == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tap_name="${REPOSITORY%/*}/kairos-pomodoro"
          brew tap "$tap_name" "$GITHUB_WORKSPACE"
          brew style --cask "$tap_name/kairos-pomodoro"
          brew audit --cask --strict "$tap_name/kairos-pomodoro"

      # GITHUB_TOKEN cannot push to main (the `Main` ruleset requires pull
      # requests and only the admin role bypasses it), so the validated bump
      # lands as a PR for a one-click admin merge.
      - name: Open a PR with the cask bump
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="cask-bump/${RELEASE_TAG}"
          git push --force origin "HEAD:${branch}"
          if gh pr view "$branch" --repo "$REPOSITORY" --json state >/dev/null 2>&1; then
            echo "A PR from $branch already exists — leaving it in place."
            exit 0
          fi
          gh pr create \
            --repo "$REPOSITORY" \
            --head "$branch" \
            --title "chore(homebrew): update cask for ${RELEASE_TAG}" \
            --body "Automated version/sha256 bump for ${RELEASE_TAG}, already validated in the release run by \`brew style\` and \`brew audit --cask --strict\`. Merge to publish the cask."
